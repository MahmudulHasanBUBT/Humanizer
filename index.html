    WRAPPER PAGE — host THIS file as index.html on a domain you control
    (GitHub Pages is free: create a repo, upload this file as index.html,
    enable Pages). Then:

    1. Sign up free at https://cleverhumanizer.ai/ and sign in.
    2. Open the API page in your profile, create a HUMANIZER widget,
       and add THIS page's domain (e.g. yourname.github.io) under its
       allowed websites.
    3. Copy the widget snippet Clever gives you (script or iframe version)
       and paste it EXACTLY where marked below. Do not remove the
       "Powered by Clever" line — it is part of the widget.
    4. In the extension's Options, paste this page's public URL.
       The floating panel loads this page, and this page loads your widget,
       so Clever sees an allowed domain.
  -->

  <!-- ▼▼▼ PASTE YOUR CLEVER HUMANIZER WIDGET SNIPPET BELOW ▼▼▼ -->

  <p>Your Clever Humanizer widget snippet has not been pasted in yet.<br>
